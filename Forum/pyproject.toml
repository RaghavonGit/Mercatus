[project]
name = "forum"
version = "0.1.0"
description = "Forum - the demo dashboard for the Mercatus project (Emptor + Mercator + Fides)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.1",
    "emptor",
    "mercator",
    "fides",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
forum = "forum.app:main"
demo = "forum.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
emptor = { path = "../Emptor", editable = true }
mercator = { path = "../Mercator", editable = true }
fides = { path = "../Fides", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/forum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: needs a running Mercator and/or Ollama; skips itself if unreachable (manual/pre-demo)",
]
